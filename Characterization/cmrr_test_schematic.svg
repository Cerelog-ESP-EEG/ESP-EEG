<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#222">
  <rect width="720" height="260" fill="#fff"/>
  <g stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Function generator -->
    <circle cx="70" cy="180" r="22"/>
    <path d="M56 180 q7 -14 14 0 t14 0"/>
    <polyline points="70,158 70,100 220,100"/>
    <polyline points="70,202 70,230 414,230"/>
    <!-- Common bus -->
    <line x1="220" y1="40" x2="220" y2="160"/>
    <line x1="220" y1="40" x2="414" y2="40"/>
    <line x1="220" y1="80" x2="414" y2="80"/>
    <line x1="220" y1="120" x2="414" y2="120"/>
    <line x1="220" y1="160" x2="414" y2="160"/>
    <!-- Terminals -->
    <circle cx="420" cy="40" r="6" fill="#fff"/>
    <circle cx="420" cy="80" r="6" fill="#fff"/>
    <circle cx="420" cy="120" r="6" fill="#fff"/>
    <circle cx="420" cy="160" r="6" fill="#fff"/>
    <circle cx="420" cy="230" r="6" fill="#fff"/>
  </g>
  <g fill="#222">
    <circle cx="220" cy="80" r="4"/>
    <circle cx="220" cy="100" r="4"/>
    <circle cx="220" cy="120" r="4"/>
  </g>
  <text x="104" y="176">Function generator</text>
  <text x="104" y="195">50/60 Hz sine</text>
  <text x="434" y="45">Channel 1 input</text>
  <text x="434" y="85">Channel 2 input</text>
  <text x="434" y="125">… all other channel inputs</text>
  <text x="434" y="165" font-weight="600">SRB1</text>
  <text x="434" y="235" font-weight="600">ESP-EEG GND</text>
  <text x="434" y="253" fill="#555">(mid-supply voltage, 0 V)</text>
</svg>
