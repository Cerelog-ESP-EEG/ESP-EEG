<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#222">
  <rect width="720" height="220" fill="#fff"/>
  <g stroke="#222" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Function generator -->
    <circle cx="70" cy="140" r="22"/>
    <path d="M56 140 q7 -14 14 0 t14 0"/>
    <polyline points="70,118 70,75 220,75"/>
    <polyline points="70,162 70,190 414,190"/>
